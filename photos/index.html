<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gallery — alex.</title>
  <meta name="description" content="photography by alex.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='4' width='20' height='16' rx='2' fill='none' stroke='%23fff' stroke-width='1.5'/%3E%3Ccircle cx='12' cy='12' r='3' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    .gallery-page { padding-top: 100px; }

    .gallery-header {
      padding: 60px 40px 40px;
      max-width: 880px;
      margin: 0 auto;
    }

    .gallery-back {
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px;
      color: #555;
      text-decoration: none;
      letter-spacing: 0.06em;
      transition: color 200ms ease;
    }

    .gallery-back:hover { color: #fff; }

    .gallery-header h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(36px, 6vw, 56px);
      font-weight: 400;
      color: #fff;
      letter-spacing: -0.03em;
      margin-top: 8px;
    }

    .gallery-header p {
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px;
      color: #666;
      letter-spacing: 0.06em;
      margin-top: 8px;
    }

    .gallery-section {
      padding: 0 40px 80px;
      max-width: 880px;
      margin: 0 auto;
    }

    .gallery-section-label {
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #555;
      margin-bottom: 16px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
    }

    .gallery-grid .photo-frame-dark { aspect-ratio: 3/4; }

    @media (max-width: 768px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
      .gallery-header, .gallery-section { padding-left: 24px; padding-right: 24px; }
    }

    @media (max-width: 480px) {
      .gallery-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="grain"></div>

  <nav>
    <a href="/" class="nav-logo">alex.</a>
    <ul class="nav-links">
      <li><a href="../#about">about</a></li>
      <li><a href="./">gallery</a></li>
    </ul>
  </nav>

  <div class="gallery-page">
    <div class="gallery-header">
      <a href="../" class="gallery-back">← back</a>
      <h1>gallery</h1>
      <p>nikon z6iii · london</p>
    </div>

    <div class="gallery-section">
      <div class="gallery-section-label">selected work</div>
      <div class="gallery-grid" id="fav-grid"></div>
    </div>

    <div class="gallery-section">
      <div class="gallery-section-label">my life</div>
      <div class="gallery-grid" id="life-grid"></div>
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-panel">
      <button class="lightbox-close">close</button>
      <img class="lightbox-img" src="" alt="" id="lightbox-img">
      <div class="lightbox-meta" id="lightbox-meta"></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {

      const favPhotos = [
        {
          src: '../assets/photos/temp_image_1784892226361.jpeg',
          camera: 'Nikon Z6Ⅲ', lens: 'NIKKOR Z 24-70mm f/4 S',
          aperture: 'ƒ/4.0', focal: '42mm', shutter: '1/640', iso: 'ISO 6400',
          location: 'london bridge'
        },
        {
          src: '../assets/photos/temp_image_1784892230103.jpeg',
          camera: 'Nikon Z6Ⅲ', lens: 'NIKKOR Z 24-70mm f/4 S',
          aperture: 'ƒ/4.0', focal: '70mm', shutter: '1/400', iso: 'ISO 12800',
          location: 'the city'
        },
        {
          src: '../assets/photos/temp_image_1784892233400.jpeg',
          camera: 'Nikon Z6Ⅲ', lens: 'NIKKOR Z 24-70mm f/4 S',
          aperture: 'ƒ/4.0', focal: '54mm', shutter: '1/100', iso: 'ISO 1600',
          location: 'bermondsey'
        }
      ];

      const lifePhotos = [
        { src: '../assets/photos/IMG_2489.jpeg', location: '' },
        { src: '../assets/photos/IMG_3321.jpeg', location: '' },
        { src: '../assets/photos/IMG_5133.jpeg', location: '' }
      ];

      function buildGrid(containerId, photos) {
        const grid = document.getElementById(containerId);
        if (!grid) return;
        photos.forEach((p, i) => {
          const frame = document.createElement('div');
          frame.className = 'photo-frame-dark';
          frame.innerHTML = `
            <img src="${p.src}" alt="${p.location || ''}" loading="lazy">
            <span class="photo-num-dark">${String(i + 1).padStart(2, '0')}</span>
          `;
          frame.addEventListener('click', () => openLightbox(p));
          grid.appendChild(frame);
        });
      }

      buildGrid('fav-grid', favPhotos);
      buildGrid('life-grid', lifePhotos);

      const lightbox = document.getElementById('lightbox');
      const lbImg = document.getElementById('lightbox-img');
      const lbMeta = document.getElementById('lightbox-meta');
      const lbClose = lightbox.querySelector('.lightbox-close');
      const lbBackdrop = lightbox.querySelector('.lightbox-backdrop');

      function openLightbox(photo) {
        lbImg.src = photo.src;
        lbImg.alt = photo.location || '';
        const hasMeta = photo.camera;
        if (hasMeta) {
          lbMeta.innerHTML = [
            '<span><span class="meta-label">camera</span> <span class="meta-value">' + (photo.camera || '—') + '</span></span>',
            '<span><span class="meta-label">lens</span> <span class="meta-value">' + (photo.lens || '—') + '</span></span>',
            '<span><span class="meta-label">aperture</span> <span class="meta-value">' + (photo.aperture || '—') + '</span></span>',
            '<span><span class="meta-label">focal</span> <span class="meta-value">' + (photo.focal || '—') + '</span></span>',
            '<span><span class="meta-label">shutter</span> <span class="meta-value">' + (photo.shutter || '—') + '</span></span>',
            '<span><span class="meta-label">iso</span> <span class="meta-value">' + (photo.iso || '—') + '</span></span>',
            photo.location ? '<span><span class="meta-label">📍</span> <span class="meta-value">' + photo.location + '</span></span>' : ''
          ].join('');
        } else {
          lbMeta.innerHTML = '<span class="meta-value">nikon z6iii</span>';
        }
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
        lbImg.src = '';
      }

      lbClose.addEventListener('click', closeLightbox);
      lbBackdrop.addEventListener('click', closeLightbox);
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
    });
  </script>
</body>
</html>
